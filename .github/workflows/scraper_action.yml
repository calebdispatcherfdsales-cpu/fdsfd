# scraper_action.yml (Version 2.1 - Path Fix)

name: Run Google Maps Scraper

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Enter the search query (e.g., real estate in Kuwait)'
        required: true
        default: 'restaurants in Dubai'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper_for_actions.py
        env:
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmaps-leads-${{ github.event.inputs.search_query }}-${{ github.run_id }}
          # =================================================
          # === YEH HAI ASAL FIX ===
          # Humne ghalat naam 'gmaps_final_leads.csv' ko theek karke 'gmaps_leads.csv' kar diya hai.
          path: gmaps_leads.csv
          # =================================================
          retention-days: 5
