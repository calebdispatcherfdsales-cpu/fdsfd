# scraper_action.yml - The brain of our automation

name: Run Google Maps Scraper

# Yeh Action kab chalega?
on:
  # Is 'workflow_dispatch' se GitHub par ek "Run workflow" ka button ban jayega
  workflow_dispatch:
    inputs:
      # Yeh button ke saath ek input field banayega
      search_query:
        description: 'Enter the search query (e.g., real estate in Kuwait)'
        required: true
        default: 'restaurants in Dubai'

jobs:
  scrape:
    # Yeh job kahan chalega? GitHub ke Ubuntu server par
    runs-on: ubuntu-latest

    steps:
      # Step 1: Hamari repository ka code is machine par copy karo
      - name: Check out repository code
        uses: actions/checkout@v3

      # Step 2: Python ko setup karo
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Python ka version

      # Step 3: Tamam zaroori libraries install karo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Hamara Python script chalao
      - name: Run Scraper
        run: python scraper_for_actions.py
        env:
          # Yahan hum user ke diye gaye input ko environment variable bana rahe hain
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}

      # Step 5: Natijay (CSV file) ko upload karo
      - name: Upload results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: gmaps-leads-${{ github.event.inputs.search_query }}
          path: gmaps_final_leads.csv

