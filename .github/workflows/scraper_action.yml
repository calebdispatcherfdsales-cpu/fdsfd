# scraper_action.yml (Version 3.0 - Auto Commit to Repo)
# Yeh version ab nateeja (CSV) ko seedha repository ke 'output' folder mein save karega.

name: Run Google Maps Scraper and Commit Results

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Enter the search query (e.g., real estate in Kuwait)'
        required: true
        default: 'restaurants in Dubai'

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code copy karo
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Python setup karo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Libraries install karo
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Python script chalao
      - name: Run Scraper
        run: python scraper_for_actions.py
        env:
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}

      # =================================================================
      # === YEH HAIN NAYE STEPS (AUTO-COMMIT LOGIC) ===
      # =================================================================
      
      # Step 5: Natijay ke liye naya folder aur file name tayyar karo
      - name: Prepare output file
        run: |
          mkdir -p output
          # Query ko file name ke liye safe banayein
          FILENAME=$(echo "${{ github.event.inputs.search_query }}" | tr ' ' '_' | tr -cd '[:alnum:]_')
          mv gmaps_leads.csv output/leads_${FILENAME}_${{ github.run_id }}.csv

      # Step 6: Git ko configure karo taake woh commit kar sake
      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions-bot@github.com'

      # Step 7: Nayi file ko repository mein add, commit, aur push karo
      - name: Commit and push if it exists
        run: |
          git pull
          git add output/*
          # Check karein ke commit karne ke liye kuch hai ya nahi
          if ! git diff --staged --quiet; then
            git commit -m "Add scraped data for: ${{ github.event.inputs.search_query }}"
            git push
          else
            echo "No changes to commit."
          fi
      # =================================================================
